# Structures to analyse.
#
# The design is PAIRED: each receptor appears twice, once inactive, once
# active. Comparing a receptor to itself removes every difference between
# receptors from the comparison.
#
# Resolution, chains and receptor regions are fetched from the RCSB API by
# scripts/01_download_structures.py — not recorded by hand.
#
# PROVENANCE: PDB IDs and states from the structure table in Latorraca,
# Venkatakrishnan & Dror, "GPCR dynamics: structures in motion" (Chem Rev
# 2017), via escholarship.org/content/qt3k69x55m.
#
# UniProt accessions are unverified except P07550. Check on uniprot.org.

generic_positions:
  - "3.49"
  - "3.50"
  - "5.58"
  - "6.30"

structures:

  - pdb_id: 1U19
    uniprot: P02699
    receptor: rhodopsin
    state: inactive
    note: Bovine rhodopsin, dark state. Textbook ionic lock R135-E247.

  - pdb_id: 3PQR
    uniprot: P02699
    receptor: rhodopsin
    state: active
    note: Metarhodopsin II with transducin C-terminal peptide.

  - pdb_id: 2RH1
    uniprot: P07550
    receptor: beta2ar
    state: inactive
    note: T4 lysozyme fused into ICL3. Lock reported weak or absent.

  - pdb_id: 3SN6
    uniprot: P07550
    receptor: beta2ar
    state: active
    note: Complex with Gs. Receptor is chain R.

  - pdb_id: 3UON
    uniprot: P08172
    receptor: m2r
    state: inactive
    note: Human M2 muscarinic acetylcholine receptor.

  - pdb_id: 4MQS
    uniprot: P08172
    receptor: m2r
    state: active
    note: Agonist-bound with a positive allosteric modulator.

  - pdb_id: 4DKL
    uniprot: P42866
    receptor: mor
    state: inactive
    note: Mouse mu-opioid receptor, antagonist-bound.

  - pdb_id: 5C1M
    uniprot: P42866
    receptor: mor
    state: active
    note: Agonist-bound, nanobody-stabilised.

  - pdb_id: 4EIY
    uniprot: P29274
    receptor: a2ar
    state: inactive
    note: High-resolution antagonist-bound A2A.

  - pdb_id: 5G53
    uniprot: P29274
    receptor: a2ar
    state: active
    note: Complex with an engineered mini-Gs.

  - pdb_id: 4DJH
    uniprot: P41145
    receptor: kor
    state: inactive
    note: UNVERIFIED. Human kappa-opioid, antagonist-bound.

  - pdb_id: 6B73
    uniprot: P41145
    receptor: kor
    state: active
    note: UNVERIFIED. Kappa-opioid in complex with Gi.