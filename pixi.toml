# Software environment of this project. Edit it with `pixi add <package>`;
# Pixi records the exact versions it installed in pixi.lock (commit both).
[workspace]
name = "gpcr-salt-bridges"
description = "Reproducible extraction of salt bridges from GPCR structures"
authors = ["Jawaher Basalma <jawaherbasalma@gmail.com>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64"]
version = "0.1.0"

[dependencies]
python = "3.13.*"
quarto = ">=1.9"
jupyterlab = ">=4"
ipykernel = ">=7"
pandas = ">=2"
matplotlib = ">=3.9"
papermill = ">=2.6"   # Quarto needs it for report parameters (-P)
openbabel = ">=3.2.1,<4"
pyyaml = ">=6.0.3,<7"
nextflow = ">=26.10.6,<27"
gemmi = ">=0.7.5,<0.8"
scipy = ">=1.18.1,<2"
tabulate = ">=0.10.0,<0.11"

[tasks]
nextflow = { cmd = "nextflow run workflow/main.nf -resume", description = "Run the pipeline through Nextflow" }
check = { cmd = "python --version && quarto --version", description = "Check that the tools work" }
# `reproduce` must rebuild every result from the raw data with one command.
reproduce = """
python scripts/01_download_structures.py &&
python scripts/02_extract_salt_bridges.py &&
python scripts/03_map_generic_positions.py &&
python scripts/04_test_lock.py &&
python scripts/figures.py &&
quarto render reports/report.qmd
"""

[pypi-dependencies]
pdbe-arpeggio = ">=1.4.4, <2"
